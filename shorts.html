<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YN 변호사 사무실 · 채무조정 상담</title>
<style>
  :root { --navy: #0b1f3f; --gold: #c9a45c; --gold-hi: #e2c07a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #050d1f; font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  /* 9:16 화면 — 화면 아무 곳이나 누르면 랜딩페이지로 이동 */
  .frame {
    position: relative; display: block;
    height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16;
    cursor: pointer; background: var(--navy); overflow: hidden; color: inherit; text-decoration: none;
  }
  video { width: 100%; height: 100%; display: block; object-fit: cover; }
  /* 소리 켜기 (브라우저는 처음에 소리 없이만 자동재생을 허용) */
  .sound {
    position: absolute; top: 14px; right: 14px; z-index: 2;
    border: 0; border-radius: 999px; padding: 8px 14px;
    background: rgba(255,255,255,.16); color: #fff; font: inherit; font-size: 14px; cursor: pointer;
    backdrop-filter: blur(6px);
  }
  /* 버튼은 영상 안(마지막 4초)에 있으므로 페이지에는 따로 두지 않음 — 화면 어디를 눌러도 이동 */
</style>
</head>
<body>
  <a class="frame" href="./?from=ad&amp;area=debt" aria-label="채무조정 상담 신청 페이지로 이동">
    <video id="video" src="shorts/yn-debt-ad-30s.mp4" autoplay muted loop playsinline preload="auto"></video>
    <button class="sound" id="sound" type="button">🔇 소리 켜기</button>
  </a>

<script>
  const video = document.getElementById("video");
  const sound = document.getElementById("sound");
  // 소리 버튼은 페이지 이동 없이 소리만 켜고 끔
  sound.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    video.muted = !video.muted;
    if (!video.muted) video.play();
    sound.textContent = video.muted ? "🔇 소리 켜기" : "🔊 소리 끄기";
  });
</script>
</body>
</html>
